version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_extractor_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist SQLite database file outside container
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
